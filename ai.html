<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>स्वास्थ्य गुरु AI</title>

    <link rel="stylesheet" href="ai-style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <h2>स्वास्थ्य गुरु AI</h2>
        </div>

        <!-- New Chat -->
        <button id="newChat" class="newChat">
            <i class="fa-solid fa-plus"></i>
            <span>New Chat</span>
        </button>

        <!-- Chat History -->
        <div class="historyTitle">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Chat History</span>
        </div>

        <div id="history" class="history">
            <div id="historyList"></div>
        </div>

    </aside>

    <!-- ================= Main Chat ================= -->

    <main class="chatArea">

        <!-- Header -->
        <header>

            <h1>तपाईंको व्यक्तिगत स्वास्थ्य गुरु AI</h1>

            <div class="headerIcons">

                <button id="headerSpeak" title="Read Last Reply">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <button id="darkMode" title="Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </header>

        <!-- Messages -->
        <section id="chatBox" class="chatBox">

            <div class="bot">

                <div class="bubble">

                    <strong>👋 Hello!</strong>

                    <br><br>

                    I am <b>Swastya Guru AI</b>.

                    <br><br>

                    Ask me any health-related question.

                </div>

            </div>

        </section>

        <!-- Input -->
        <div class="inputArea">

            <input
                id="prompt"
                type="text"
                autocomplete="off"
                placeholder="Type your health question...">

            <div class="tools">

                <!-- Image -->
                <label for="uploadImage">
                    <input
                        id="uploadImage"
                        type="file"
                        hidden
                        accept="image/*">
                    <i class="fa-regular fa-image"></i>
                </label>

                <!-- Video -->
                <label for="video">
                    <input
                        id="video"
                        type="file"
                        hidden
                        accept="video/*">
                    <i class="fa-solid fa-video"></i>
                </label>

                <!-- Camera -->
                <button id="camera" type="button">
                    <i class="fa-solid fa-camera"></i>
                </button>

                <!-- Microphone -->
                <button id="mic" type="button">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <!-- Speaker -->
                <button id="speak" type="button">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <!-- Send -->
                <button id="send" type="button">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>

        </div>

    </main>

</div>

<script src="ai-script.js"></script>

</body>
</html>
