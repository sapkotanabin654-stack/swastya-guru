<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्वास्थ्य गुरु AI</title>

    <link rel="stylesheet" href="ai-style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <h2>Alu Ai</h2>
        </div>

        <!-- New Chat -->
        <button class="newChat" id="newChat">
            <i class="fa-solid fa-plus"></i>
            New Chat
        </button>

        
        <div class="history" id="history"></div>

    </aside>

    
    <main class="chatArea">

        <header>

            <div>
                <h1>तपाईंको व्यक्तिगत स्वास्थ्य गुरु AI</h1>
            </div>

            <div class="headerIcons">

                <button id="headerSpeak" title="उत्तर पढ्नुहोस्">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <button title="डार्क मोड">
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </header>

        <section id="chatBox">

            <div class="bot">

                <div class="bubble">

                    <strong>नमस्ते 👋</strong>

                    <br><br>

                    म <b>स्वास्थ्य गुरु AI</b> हुँ।

                    <br><br>

                    तपाईं आफ्नो स्वास्थ्य सम्बन्धी कुनै पनि प्रश्न सोध्न सक्नुहुन्छ।

                </div>

            </div>

        </section>

        

        <div class="inputArea">

            <input
            type="text"
            id="prompt"
            placeholder="यहाँ आफ्नो स्वास्थ्य सम्बन्धी प्रश्न लेख्नुहोस्...">

            <div class="tools">

              
<label for="uploadImage">
    <input
        type="file"
        id="uploadImage"
        hidden
        accept="image/*">

    <i class="fa-regular fa-image"></i>
</label>


<label for="cameraInput">
    <input
        type="file"
        id="cameraInput"
        hidden
        accept="image/*"
        capture="environment">

    <i class="fa-solid fa-camera"></i>
</label>
                <label>
                    <input
                    type="file"
                    id="video"
                    hidden
                    accept="video/*">

                    <i class="fa-solid fa-video"></i>
                </label>

                <button id="camera">
                    <i class="fa-solid fa-camera"></i>
                </button>

                <button id="mic">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button id="speak">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <button id="send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>

        </div>

    </main>

</div>

<script src="ai-script.js"></script>

</body>
</html>
